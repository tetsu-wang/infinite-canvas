services:
  app:
    platform: linux/arm64
    image: infinite-canvas:local
    container_name: infinite-canvas-local
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - TZ=Asia/Shanghai
